name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release Linux Packages (.deb, .rpm, .AppImage)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Tauri Bundles (.deb, .rpm, .AppImage)
        env:
          NO_STRIP: 1
        run: |
          npx tauri build

      - name: Verify & Checksum Generated Bundles
        run: |
          echo "=== Generated Packages ==="
          ls -lh src-tauri/target/release/bundle/deb/*.deb
          ls -lh src-tauri/target/release/bundle/rpm/*.rpm
          ls -lh src-tauri/target/release/bundle/appimage/*.AppImage
          
          echo "=== Computing SHA256 Checksums ==="
          cd src-tauri/target/release/bundle
          sha256sum deb/*.deb rpm/*.rpm appimage/*.AppImage > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "ACME.rc ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
